<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    .login .card { width: 100%; max-width: 360px; }
    .login form { display: grid; gap: 12px; margin-top: 12px; }
    .login .err { color: var(--down); min-height: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="login">
    <div class="card">
      <div class="brand"><div class="logo">⟠</div><div><h1>منصة التداول الآلي</h1><div class="sub">دخول آمن</div></div></div>
      <form id="f">
        <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password" required autofocus>
        <button class="btn primary" type="submit">دخول</button>
        <div class="err" id="err"></div>
      </form>
    </div>
  </div>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      try {
        const res = await fetch("/api/login", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: document.getElementById("pw").value }),
        });
        const json = await res.json().catch(() => ({ error: "الخادم غير متاح على هذا الرابط — تأكد أنك تستخدم الرابط الصحيح للمنصة" }));
        if (!res.ok) throw new Error(json.error || "خطأ");
        location.href = "/";
      } catch (x) {
        err.textContent = x.message;
      }
    });
  </script>
</body>
</html>
